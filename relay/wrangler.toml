# Drawbook relay: GPs send sealed notices to their LPs; Stargira stores ciphertext it cannot read.
name = "drawbook-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
PUBLIC_BASE = "https://www.stargira.com/drawbook/connect"
MAIL_FROM = "Drawbook <noreply@mail.stargira.com>"
# DEV_RETURN_CODE = "1"   # local testing only: return the sign-up code in the response instead of emailing it

[[d1_databases]]
binding = "DB"
database_name = "drawbook-relay"
database_id = "00334e72-2d4a-45c9-b5e0-6f273f5de0e3"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]  # daily clean-up: old ciphertext, expired sign-ups
